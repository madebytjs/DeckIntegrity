name: tests

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries for headless GUI tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install GUI toolkit
        run: python -m pip install -q PySide6-Essentials
      - name: Unit tests (engine and GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -t tests -v
      - name: Build single-file bundle
        run: python scripts/build_pyz.py
      - name: Refuses to run without a terminal (double-click guard)
        run: |
          code=0
          python dist/deck-integrity.pyz --quick < /dev/null || code=$?
          test "$code" -eq 3
      - name: Smoke run on a real Linux host
        run: python dist/deck-integrity.pyz --passes 2 --file-mib 64 --ram-mib 32 --yes --output "$RUNNER_TEMP/report" || test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python }}
          path: ${{ runner.temp }}/report
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: deck-integrity.pyz
          path: dist/deck-integrity.pyz

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build_appimage.sh
      - name: AppImage starts (GUI selftest and command line)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          app=dist/DeckIntegrity-x86_64.AppImage
          chmod +x "$app"
          timeout 60 "$app" --selftest
          timeout 30 "$app" --cli --version
          timeout 300 "$app" --cli --passes 1 --file-mib 64 --ram-mib 32 --yes --output "$RUNNER_TEMP/appimage-report" || test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: DeckIntegrity-AppImage
          path: dist/DeckIntegrity-x86_64.AppImage

  # Pushing a tag such as v0.3.0 creates a DRAFT release with both downloads attached.
  # Nothing is public until the draft is reviewed and published on GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/DeckIntegrity-x86_64.AppImage
            dist/deck-integrity.pyz
