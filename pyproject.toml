[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-integrity"
dynamic = ["version"]
description = "Hardware health check for SteamOS handhelds: tests that storage, memory and processor handle data correctly"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
deck-integrity = "deck_integrity.cli:main_exit"

[project.gui-scripts]
deck-integrity-gui = "deck_integrity.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "deck_integrity.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deck_integrity.gui" = ["icon.png"]
